services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chunky
      POSTGRES_USER: chunky
      POSTGRES_PASSWORD: chunky
    ports:
      - "5432:5432"
    volumes:
      - chunky_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chunky -d chunky"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chunky_postgres:
